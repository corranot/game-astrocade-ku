name: Auto Merge Claude PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Hanya jalan otomatis untuk PR buatan Anda / Claude Code
    if: github.event.pull_request.user.login == 'corranot'
    steps:
      - name: Tandai Siap Review & Langsung Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr ready "$PR_URL" || true
          gh pr merge "$PR_URL" --auto --squash || gh pr merge "$PR_URL" --squash
