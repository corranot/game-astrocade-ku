name: Auto Sync Game Studios & Skills

on:
  schedule:
    - cron: '0 2 * * *' # Otomatis jalan setiap hari jam 09:00 WIB
  workflow_dispatch:    # Tombol manual jika ingin update kapan saja

permissions:
  contents: write

jobs:
  sync-everything:
    runs-on: ubuntu-latest
    steps:
      # 1. Tekan tombol "Sync Fork" resmi milik GitHub lewat API
      - name: Official GitHub Sync Fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api repos/corranot/game-astrocade-ku/merge-upstream -f branch=main || echo "Sudah sinkron atau skip upstream"

      # 2. Ambil kode terbaru yang sudah tersinkron
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main

      # 3. Update otomatis 13 Skill Pilihan (Dengan Pengaman Error)
      - name: Update 13 Selected Skills
        run: |
          mkdir -p .claude/skills

          if git clone --depth 1 https://github.com /tmp/ponytail; then
            for s in ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review; do
              if [ -d "/tmp/ponytail/skills/$s" ]; then
                rm -rf ".claude/skills/$s"
                cp -r "/tmp/ponytail/skills/$s" ".claude/skills/$s"
              fi
            done
          fi

          if git clone --depth 1 https://github.com /tmp/caveman; then
            for s in caveman ultracave megacave caveman-commit caveman-review caveman-help; do
              if [ -d "/tmp/caveman/skills/$s" ]; then
                rm -rf ".claude/skills/$s"
                cp -r "/tmp/caveman/skills/$s" ".claude/skills/$s"
              fi
            done
          fi

          if git clone --depth 1 https://github.com /tmp/leanrea; then
            if [ -d "/tmp/leanrea/leanrea" ]; then
              rm -rf .claude/skills/leanrea
              cp -r /tmp/leanrea/leanrea .claude/skills/leanrea
            fi
          fi

      # 4. Simpan otomatis ke GitHub jika ada perubahan versi baru
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .claude/skills/
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update 13 selected skills"
            git push origin main
          else
            echo "Semua skill sudah versi paling baru!"
          fi
