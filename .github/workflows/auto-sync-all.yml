name: Auto Sync Game Studios & Skills

on:
  schedule:
    - cron: '0 2 * * *' # Otomatis jalan setiap hari jam 09:00 WIB
  workflow_dispatch:    # Tombol manual jika ingin update kapan saja

permissions:
  contents: write

jobs:
  sync-everything:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode main (tanpa "Sync Fork" dari repo induk: repo ini sudah jauh berbeda, sinkron selalu
      #    gagal diam-diam, dan kalau berhasil akan push ke main tanpa PR/CI)
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main

      # 2. Update otomatis 15 skill pilihan dari repo aslinya (clone gagal = langkah gagal, bukan diam-diam)
      - name: Update 15 Selected Skills
        run: |
          set -e
          mkdir -p .claude/skills
          # copy <repo dir> <subdir holding the skills> <skill names...>
          copy() { src="$1/$2"; shift 2; for s in "$@"; do if [ -d "$src/$s" ]; then rm -rf ".claude/skills/$s"; cp -r "$src/$s" ".claude/skills/$s"; else echo "::warning::skill $s not found in $src"; fi; done; }
          git clone --depth 1 https://github.com/DietrichGebert/ponytail /tmp/ponytail
          copy /tmp/ponytail skills ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review
          git clone --depth 1 https://github.com/JuliusBrussee/caveman /tmp/caveman
          copy /tmp/caveman skills caveman ultracave megacave caveman-commit caveman-review caveman-help caveman-compress caveman-stats
          git clone --depth 1 https://github.com/aicodeking/leanrea /tmp/leanrea
          copy /tmp/leanrea . leanrea

      # 3. Perubahan skill masuk lewat PR (CI + automerge), tidak di-push langsung ke main
      - name: Open a PR with the skill updates
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/
          if git diff --staged --quiet; then echo "Semua skill sudah versi paling baru!"; exit 0; fi
          branch="auto-sync/skills-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git commit -m "chore: auto-update skill pilihan (ponytail, caveman, leanrea)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: auto-update skill pilihan $(date -u +%Y-%m-%d)" \
            --body "Dibuat otomatis oleh Auto Sync. Isi: salinan terbaru skill ponytail, caveman, leanrea dari repo aslinya. Masuk lewat CI seperti PR lain; tinjau isinya bila perlu, karena skill dibaca agen sebagai instruksi."
