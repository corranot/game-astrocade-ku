name: Auto Sync Game Studios & Skills

on:
  schedule:
    - cron: '0 2 * * *' # Otomatis jalan setiap hari jam 09:00 WIB
  workflow_dispatch:    # Tombol manual jika ingin update kapan saja

permissions:
  contents: write

jobs:
  sync-everything:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo Anda
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tarik Update dari Game Studios Asli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git remote add upstream https://github.com
          git fetch upstream main
          git merge upstream/main --no-edit -X ours || true

      - name: Update 13 Skill Pilihan (Ponytail, Caveman, Leanrea)
        run: |
          mkdir -p .claude/skills

          git clone --depth 1 https://github.com /tmp/ponytail
          for s in ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review; do
            rm -rf ".claude/skills/$s"
            cp -r "/tmp/ponytail/skills/$s" ".claude/skills/$s"
          done

          git clone --depth 1 https://github.com /tmp/caveman
          for s in caveman ultracave megacave caveman-commit caveman-review caveman-help; do
            rm -rf ".claude/skills/$s"
            cp -r "/tmp/caveman/skills/$s" ".claude/skills/$s"
          done

          git clone --depth 1 https://github.com /tmp/leanrea
          rm -rf .claude/skills/leanrea
          cp -r /tmp/leanrea/leanrea .claude/skills/leanrea

      - name: Simpan Otomatis ke GitHub
        run: |
          git add .
          git diff --staged --quiet || git commit -m "chore: auto-sync game studios & 13 skills"
          git push origin main
