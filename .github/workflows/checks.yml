name: Checks

# Every PR and push to main: fast checks on all games, then each game started the way Astrocade runs it.
# PRs by the owner are merged only after both jobs pass (this replaced the old instant auto-merge).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    name: Syntax, JSON, THREE at import, upload sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/ci-checks.sh

  bundle:
    name: Each game starts as an Astrocade bundle
    runs-on: ubuntu-latest # Ubuntu 26.04: needs Playwright 1.61 or newer
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # to list the PR's files
    steps:
      # Only the games a PR changes are started (a change to tools/ or .github/ can break any game, so then all
      # are). A PR that touches no game (docs, research, agent settings) passes without starting a browser, so the
      # owner's automerge below still runs. Pushes to main always test every game.
      - name: Which games does this change touch?
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "dirs=ALL" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^(tools|\.github)/'; then dirs=ALL
          else dirs=$(echo "$files" | { grep -oE '^prototypes/[A-Za-z0-9._-]+/' || true; } | sort -u | tr '\n' ' '); fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "games to test: ${dirs:-none (bundle test skipped)}"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.dirs != ''
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.dirs != ''
        with:
          node-version: 22
      - name: Playwright with Chromium
        if: steps.scope.outputs.dirs != ''
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.64.1 esbuild@0.24.0 # same pin as docs/engine-reference/web
          npx playwright install --with-deps chromium
      - name: Start each changed game from its bundle
        if: steps.scope.outputs.dirs != ''
        env:
          DIRS: ${{ steps.scope.outputs.dirs }}
        run: |
          [ "$DIRS" = ALL ] && DIRS=$(ls -d prototypes/*/)
          fail=0
          for d in $DIRS; do
            [ -d "$d" ] || continue # a game folder the PR deletes
            grep -q '<script type="module" src="./game.js"></script>' "$d/index.html" 2>/dev/null || continue
            out=$(node tools/astrocade-bundle-test.js "$d") || { echo "::error::$d bundle test crashed"; fail=1; continue; }
            echo "$d $out" | tr -d '\n'; echo
            echo "$out" | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(r.started && !r.errors.length && !(r.fail || []).length ? 0 : 1)' || { echo "::error::$d breaks a feed rule (see fail above)"; fail=1; }
          done
          exit $fail
      - name: Baked sprites match their drawing code
        if: steps.scope.outputs.dirs != '' && (success() || failure()) # report it even when a bundle above failed
        env:
          DIRS: ${{ steps.scope.outputs.dirs }}
        run: |
          [ "$DIRS" = ALL ] && DIRS="tools/fixtures/bake-demo/ $(ls -d prototypes/*/)"
          fail=0
          for d in $DIRS; do
            [ -f "$d/bake.js" ] || continue
            node tools/bake.js "$d" --check || { echo "::error::$d bake is stale (node tools/bake.js $d)"; fail=1; }
          done
          exit $fail

  automerge:
    name: Merge the owner's PR once checks pass
    needs: [fast, bundle]
    # skill updates copied from outside repos (auto-sync/*) are instructions for the agents: a person merges those
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'corranot' && !startsWith(github.head_ref, 'auto-sync/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          gh pr ready "$PR_URL" || true
          # only the commit these checks ran on: a push after them waits for its own run
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
          # the branch is in main now (squashed): remove it so finished work does not pile up as branches
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" >/dev/null || echo "::warning::branch $HEAD_REF not deleted"
