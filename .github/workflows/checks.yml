name: Checks

# Every PR and push to main: fast checks, then each game started the way Astrocade runs it, for the games the
# change touches only (prototypes/<game>/). Run it by hand (Actions > Checks > Run workflow) to test every game.
# PRs by the owner are merged only after both jobs pass (this replaced the old instant auto-merge).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Which games does this change touch?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # to list the PR's files
    outputs:
      dirs: ${{ needs.scope.outputs.dirs }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch) dirs=$(gh api "repos/$REPO/contents/prototypes" --jq '.[] | select(.type=="dir") | "prototypes/\(.name)/"' | tr '\n' ' ') ;;
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') ;;
            *) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null || true) ;;
          esac
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "$files" | sed 's/^/  /'
            dirs=$(echo "$files" | { grep -oE '^(prototypes|tools/fixtures)/[A-Za-z0-9._-]+/' || true; } | sort -u | tr '\n' ' ')
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "games to test: ${dirs:-none}"

  fast:
    name: Syntax, JSON, THREE at import, upload sets
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          DIRS: ${{ needs.scope.outputs.dirs }}
          GAMES: none # tools only when the change touches no game
        run: bash tools/ci-checks.sh $DIRS

  bundle:
    name: Each game starts as an Astrocade bundle
    needs: scope
    runs-on: ubuntu-latest # Ubuntu 26.04: needs Playwright 1.61 or newer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: needs.scope.outputs.dirs != ''
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.dirs != ''
        with:
          node-version: 22
      - name: Playwright with Chromium
        if: needs.scope.outputs.dirs != ''
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.64.1 esbuild@0.24.0 # same pin as docs/engine-reference/web
          npx playwright install --with-deps chromium
      - name: Start each changed game from its bundle
        if: needs.scope.outputs.dirs != ''
        env:
          DIRS: ${{ needs.scope.outputs.dirs }}
        run: |
          fail=0
          for d in $DIRS; do
            [ -d "$d" ] || continue # a game folder the PR deletes
            grep -q '<script type="module" src="./game.js"></script>' "$d/index.html" 2>/dev/null || continue
            out=$(node tools/astrocade-bundle-test.js "$d") || { echo "::error::$d bundle test crashed"; fail=1; continue; }
            echo "$d $out" | tr -d '\n'; echo
            echo "$out" | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(r.started && !r.errors.length && !(r.fail || []).length ? 0 : 1)' || { echo "::error::$d breaks a feed rule (see fail above)"; fail=1; }
          done
          exit $fail
      - name: Baked sprites match their drawing code
        if: needs.scope.outputs.dirs != '' && (success() || failure()) # report it even when a bundle above failed
        env:
          DIRS: ${{ needs.scope.outputs.dirs }}
        run: |
          fail=0
          for d in $DIRS; do
            [ -f "$d/bake.js" ] || continue
            node tools/bake.js "$d" --check || { echo "::error::$d bake is stale (node tools/bake.js $d)"; fail=1; }
          done
          exit $fail

  automerge:
    name: Merge the owner's PR once checks pass
    needs: [fast, bundle]
    # auto-sync/* skill updates merge here too once checks pass (owner's choice, 2026-11-23); CI does not review skill text
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'corranot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          gh pr ready "$PR_URL" || true
          # only the commit these checks ran on: a push after them waits for its own run
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
          # the branch is in main now (squashed): remove it so finished work does not pile up as branches
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" >/dev/null || echo "::warning::branch $HEAD_REF not deleted"
