.card.fit .giftbox{line-height:1;padding:0;font-size:calc(var(--u)*220px);top:calc(var(--u)*15px)}
.card .big{position:relative}
/* rating and gift cards: sized by their content, even inner margins (2 x --m; the bottom adds the button's 7-unit shadow), every row box tight so each gap is exactly --m */
.card.fit{box-sizing:border-box;min-height:0;gap:var(--m);padding:calc(var(--m)*2) calc(var(--m)*2) calc(var(--m)*2 + var(--u)*7px)}
.card.fit .earn{line-height:1}
/* decorations belong to their row: the star's 5-unit drop shadow, the tick badges hanging 6 units right and down (right side only, so the row's ink is centred) */
.card.fit .stars{padding-bottom:calc(var(--u)*5px)}.card.fit .parts{padding:0 calc(var(--u)*6px) calc(var(--u)*6px) 0}
@media (prefers-reduced-motion: reduce){.hud *{animation-duration:.01s!important;animation-iteration-count:1!important}}
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;background:radial-gradient(circle at 50% 40%,#fff3f8,#ffc9e1 60%,#ff9ec9);transition:opacity .35s}
#load.out{opacity:0;pointer-events:none}
#load .sw{width:min(30vmin,170px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#ff7fb6 0 20deg,#fff 20deg 40deg);border:min(1.6vmin,9px) solid #fff;box-shadow:0 1vmin 0 #e889b4;animation:spin 1.6s linear infinite}
#load .lbar{width:min(60vmin,340px);height:min(4vmin,22px);border-radius:999px;background:#fff;overflow:hidden;border:min(.8vmin,5px) solid #fff;box-shadow:0 0 0 2px #f3a6c8}
#load .lbar i{display:block;height:100%;width:0;background:linear-gradient(#9ee7ff,#3fb8ff);border-radius:999px}
</style>

<body>
<div id="app"></div>
<div id="load" aria-hidden="true"><div class="sw"></div><div class="lbar"><i></i></div></div>
<script>
// the loading screen follows the real steps (three.js, the game, its first frame) and creeps between them
(function () {
  var el = document.getElementById('load'), bar = el.querySelector('.lbar i'), shown = 0, target = 8, cap = 30, finished = false;
  function step(v) { if (v > target) target = v; cap = Math.max(cap, Math.min(97, v + 18)); }
  window.__load = { step: step, done: function () { step(100); cap = 100; finished = true; } };
  addEventListener('three-ready', function () { step(55); });
  addEventListener('error', function () { setTimeout(function () { if (document.getElementById('load')) window.__load.done(); }, 4000); }); // a script error: never hide the page behind it for good
  function tick() {
    target += (cap - target) * 0.02; shown += (target - shown) * (finished ? 0.35 : 0.12);
    bar.style.width = Math.min(100, shown) + '%';
    if (finished && shown > 99.5) { el.classList.add('out'); setTimeout(function () { el.remove(); }, 400); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.187.0/three.module.min.js" } }</script>
<script type="module" data-lib>import * as THREE from 'three'; window.THREE = THREE; window.dispatchEvent(new Event('three-ready'));</script>
