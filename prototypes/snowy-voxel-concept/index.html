<!-- HUD: deep winter-blue glass plaques with a cream rim, mint and parka-red accents; rounded Baloo from the asset map -->
<style>

.glass{background:linear-gradient(#3b4c8e,#2c3a72 60%,#24306a);border:calc(var(--u)*4px) solid #cfe6ff;box-shadow:0 0 0 calc(var(--u)*3px) var(--ink),inset 0 calc(var(--u)*4px) 0 rgba(255,255,255,.28),inset 0 calc(var(--u)*-5px) 0 rgba(10,14,40,.35),0 calc(var(--u)*8px) 0 calc(var(--u)*2px) rgba(26,33,71,.45);box-sizing:border-box}

.bookB em{position:absolute;top:calc(var(--u)*-8px);right:calc(var(--u)*-8px);min-width:calc(var(--u)*32px);height:calc(var(--u)*32px);border-radius:calc(var(--u)*16px);background:var(--red);box-shadow:0 0 0 calc(var(--u)*3px) var(--ink);font-style:normal;font-size:calc(var(--u)*22px);line-height:calc(var(--u)*32px);text-align:center;color:#fff;display:none}

<div id="app"></div>
<script>
// never a dead end: no picture after a script error (4 s), after 12 s waiting for the 3D library (code LIB), or when
// WebGL fails (code GL, from game.js), a retry button with the reason code takes the screen
(function () {
  var shown = false;
  function fail(code) {
    if (shown || (code !== 'GL' && document.querySelector('#app.live'))) return; shown = true;
    var app = document.getElementById('app');
    app.innerHTML = '<button class="retry" aria-label="Retry">↻<small>' + code + '</small></button>';
    app.querySelector('button').onclick = function () { location.reload(); };
  }
  window.__load = { done: function () {}, fail: fail };
  addEventListener('error', function () { setTimeout(function () { fail('ERR'); }, 4000); });
  setTimeout(function () { fail('LIB'); }, 12000);
})();
</script>
