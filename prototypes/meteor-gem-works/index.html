<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meteor Gem Works</title>
<!-- HUD: warm wood and brass with crystal accents (plan.md §8); the rounded Baloo family loads from the asset map -->
<style>
html,body{margin:0;height:100%;background:#2a2233;overflow:hidden;font-family:"Baloo 2","Baloo Da 2","Baloo Bhaijaan 2","Arial Rounded MT Bold","Nunito","Noto Sans",system-ui,sans-serif;font-weight:800}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;--u:1;--ink:#3a2418;--m:calc(var(--u)*26px);background:#e9c08a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff3dc}
.out{--o:calc(var(--u)*3.5px);text-shadow:var(--o) 0 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),0 var(--o) 0 var(--ink),0 calc(var(--o)*-1) 0 var(--ink),var(--o) var(--o) 0 var(--ink),calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),0 calc(var(--o)*2) 0 var(--ink)}
/* wooden plaque with a brass rim */
.chip{position:absolute;top:var(--m);display:flex;align-items:center;gap:calc(var(--u)*12px);height:calc(var(--u)*86px);box-sizing:border-box;padding:0 calc(var(--u)*30px) 0 calc(var(--u)*14px);border-radius:calc(var(--u)*30px);direction:ltr;
  background:linear-gradient(#a8693c,#86502c 55%,#6e4024);border:calc(var(--u)*5px) solid #e5b75a;box-shadow:0 0 0 calc(var(--u)*3px) var(--ink),inset 0 calc(var(--u)*4px) 0 rgba(255,220,170,.35),inset 0 calc(var(--u)*-5px) 0 rgba(40,20,10,.35),0 calc(var(--u)*8px) 0 calc(var(--u)*2px) rgba(58,36,24,.55)}
.cash{left:var(--m)}
[dir=rtl] .cash{left:auto;right:var(--m)}
.chip b{font-size:calc(var(--u)*54px);line-height:1;min-width:calc(var(--u)*56px);color:#ffe08a}
.chip.bump{animation:bump .25s ease-out}
.coin{flex:none;width:calc(var(--u)*58px);height:calc(var(--u)*58px);border-radius:50%;box-sizing:border-box;border:calc(var(--u)*4px) solid var(--ink);background:radial-gradient(circle at 36% 30%,#fff1b0 0 12%,#ffd35a 13% 52%,#d99a2e 53% 62%,#ffcf55 63%);box-shadow:inset 0 calc(var(--u)*-4px) 0 rgba(150,90,20,.5)}
.mute{position:absolute;top:var(--m);right:var(--m);width:calc(var(--u)*86px);height:calc(var(--u)*86px);border-radius:50%;pointer-events:auto;cursor:pointer;padding:calc(var(--u)*14px);-webkit-tap-highlight-color:transparent;box-sizing:border-box;
  background:radial-gradient(circle at 38% 30%,#b47a48,#7e4f2e 70%);border:calc(var(--u)*5px) solid #e5b75a;box-shadow:0 0 0 calc(var(--u)*3px) var(--ink),0 calc(var(--u)*7px) 0 calc(var(--u)*2px) rgba(58,36,24,.55)}
[dir=rtl] .mute{right:auto;left:var(--m)}
.mute svg{display:block;width:100%;height:100%;fill:#ffe08a;stroke:#ffe08a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.mute .wav{fill:none}.mute .x{display:none;fill:none}
.mute.off .wav{display:none}.mute.off .x{display:block}
/* carry count over the stack */
.carry{position:absolute;translate:-50% -100%;font-size:calc(var(--u)*40px);line-height:1;color:#fff3dc;white-space:nowrap;direction:ltr}
.carry.max{color:#ffd35a;font-size:calc(var(--u)*46px);animation:pulse .6s ease-in-out infinite}
.carry[hidden],.pop[hidden],.banner[hidden],.stick[hidden]{display:none}
/* floating world pops */
.pop{position:absolute;translate:-50% -50%;direction:ltr;font-size:calc(var(--u)*46px);line-height:1;white-space:nowrap;color:#fff3dc}
.pop.gold{color:#ffd35a}
.pop.big{font-size:calc(var(--u)*78px);color:#ffe3f6;--ink:#5a1f5e;animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
/* banner for unlocks and the hatch: a ribbon with a brass rim, slides in, holds, fades */
.banner{position:absolute;top:calc(var(--u)*230px);left:50%;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4px);padding:calc(var(--u)*18px) calc(var(--u)*56px) calc(var(--u)*22px);border-radius:calc(var(--u)*40px);text-align:center;
  background:linear-gradient(#3fb3a3,#2a7f78);border:calc(var(--u)*6px) solid #e5b75a;box-shadow:0 0 0 calc(var(--u)*3px) var(--ink),inset 0 calc(var(--u)*5px) 0 rgba(255,255,255,.25),0 calc(var(--u)*12px) calc(var(--u)*30px) rgba(58,36,24,.45);white-space:nowrap}
.banner.go{animation:ban .5s cubic-bezier(.2,1.5,.4,1)}
.banner .bt{font-size:calc(var(--u)*64px);line-height:1;color:#ffe08a}
.banner .bs{font-size:calc(var(--u)*36px);line-height:1.1;color:#fff3dc}
/* first-time hint: a hand that drags */
.hint{position:absolute;left:50%;bottom:calc(var(--u)*150px);translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12px);transition:opacity .4s}
.hint.gone{opacity:0}
.hint b{font-size:calc(var(--u)*44px);color:#fff3dc;white-space:nowrap}
.hand{width:calc(var(--u)*90px);height:calc(var(--u)*90px);border-radius:50%;background:radial-gradient(circle,rgba(255,243,220,.95) 0 30%,rgba(255,243,220,.35) 31% 55%,transparent 56%);animation:drag 1.6s ease-in-out infinite}
/* the joystick ring */
.stick{position:absolute;width:calc(var(--u)*180px);height:calc(var(--u)*180px);translate:-50% -50%;border-radius:50%;border:calc(var(--u)*5px) solid rgba(255,243,220,.6);background:rgba(58,36,24,.18)}
.stick i{position:absolute;left:50%;top:50%;width:calc(var(--u)*80px);height:calc(var(--u)*80px);margin:calc(var(--u)*-40px);border-radius:50%;background:radial-gradient(circle at 38% 30%,#ffe9b0,#e5b75a 70%);box-shadow:0 calc(var(--u)*5px) 0 rgba(58,36,24,.5)}
.retry{position:absolute;inset:0;margin:auto;width:140px;height:140px;border-radius:50%;border:5px solid #e5b75a;background:#7e4f2e;color:#ffe08a;font-size:64px;cursor:pointer}
.retry small{display:block;font-size:18px}
@keyframes bump{40%{transform:scale(1.14)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes popIn{from{transform:scale(.3)}}
@keyframes ban{from{transform:translateY(calc(var(--u)*-60px)) scale(.6);opacity:0}}
@keyframes drag{0%,100%{transform:translateX(calc(var(--u)*-70px))}50%{transform:translateX(calc(var(--u)*70px))}}
@media (prefers-reduced-motion: reduce){.banner.go,.pop.big,.hand,.carry.max{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// never a dead end: no picture after a script error (4 s), after 12 s waiting for the 3D library (code LIB), or when
// WebGL fails (code GL, from game.js), a retry button with the reason code takes the screen
(function () {
  var shown = false;
  function fail(code) {
    if (shown || (code !== 'GL' && document.querySelector('#app canvas'))) return; shown = true;
    var app = document.getElementById('app');
    app.innerHTML = '<button class="retry" aria-label="Retry">↻<small>' + code + '</small></button>';
    app.querySelector('button').onclick = function () { location.reload(); };
  }
  window.__load = { done: function () {}, fail: fail };
  addEventListener('error', function () { setTimeout(function () { fail('ERR'); }, 4000); });
  setTimeout(function () { fail('LIB'); }, 12000);
})();
</script>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.187.0/three.module.min.js" } }</script>
<script type="module" data-lib>import * as THREE from 'three'; window.THREE = THREE; window.dispatchEvent(new Event('three-ready'));</script>
<script type="module" src="./game.js"></script>
</body>
</html>
