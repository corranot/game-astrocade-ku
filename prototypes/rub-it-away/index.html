<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Rub It Away</title>
<meta name="description" content="Rub away the thing that spoils the scene and watch it fix itself. Wrong rub? Something funny happens and it grows back.">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ecd9b0}body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:linear-gradient(#8fd3f0,#cdeefa 55%,#7cc46a 55%,#5fae4f);font:900 9vh/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f0a03a;-webkit-text-stroke:.9vh #3a2f45;paint-order:stroke;text-align:center;transition:opacity .25s;pointer-events:none}
#boot i{display:block;width:12vh;height:12vh;border-radius:50%;background:#f8d34a;border:.8vh solid #3a2f45;animation:b .9s ease-in-out infinite alternate}
@keyframes b{to{transform:translateY(-2vh) scale(1.06)}}
@media (prefers-reduced-motion:reduce){#boot i{animation:none}}</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="boot" aria-hidden="true">RUB IT<br>AWAY<i></i></div>
<script src="./game.js"></script>
</body>
</html>
