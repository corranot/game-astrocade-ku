<div id="app"></div>
<script>
// Boot guard: if the game cannot start, a big retry button appears with a short code saying why
// (E1 3D library missing, E2 script error before start, E3 start threw, E4 the host never called run).
(function () {
  var first = null;
  function show(code) {
    if (window.__started || document.getElementById('fail')) return;
    var app = document.getElementById('app'); if (!app) return;
    var d = document.createElement('div'); d.id = 'fail';
    d.innerHTML = '<button aria-label="retry">&#8635;</button><div class="why"></div>';
    d.querySelector('.why').textContent = code;
    d.firstChild.addEventListener('click', function () { location.reload(); });
    app.appendChild(d);
    try { console.warn('boot ' + code); if (window.lib && lib.log) lib.log('boot ' + code); } catch (e) { /* no host log */ }
  }
  window.__bootFail = show;
  addEventListener('error', function (e) {
    if (window.__started) return;
    if (!first) first = 'E2 ' + (e.message || 'error') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
    setTimeout(function () { show(first); }, 4000);
  });
  addEventListener('unhandledrejection', function (e) {
    if (window.__started) return;
    if (!first) first = 'E2 ' + String((e.reason && e.reason.message) || e.reason);
    setTimeout(function () { show(first); }, 4000);
  });
  setTimeout(function () { if (!window.THREE) show('E1 3D'); }, 12000);
  setTimeout(function () { if (!window.__runCalled) show('E4 no run'); }, 30000);
})();
</script>
