<div id="app"></div>
<script>
// if the 3D library never arrives (offline, blocked), a big retry button replaces the empty frame
(function () {
  function retry() {
    if (window.__started || document.getElementById('fail')) return;
    var app = document.getElementById('app'), d = document.createElement('div');
    d.id = 'fail'; d.innerHTML = '<button aria-label="retry">&#8635;</button>';
    d.firstChild.addEventListener('click', function () { location.reload(); });
    app.appendChild(d);
  }
  addEventListener('error', function () { setTimeout(retry, 4000); });
  setTimeout(retry, 12000);
})();
</script>
