<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snip It: Cut to Fix</title>
<link rel="modulepreload" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.187.0/three.module.min.js">
<link rel="modulepreload" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.187.0/three.core.js">
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5.1.0/800.css">
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-da-2@5.1.0/800.css">
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-bhaijaan-2@5.1.0/800.css">
<style>
html,body{margin:0;height:100%;background:#ffe9b8;overflow:hidden;font-family:"Baloo 2","Baloo Da 2","Baloo Bhaijaan 2","Arial Rounded MT Bold","Nunito","Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Arabic",system-ui,sans-serif;font-weight:800}
button{font-family:inherit;font-weight:800}
[hidden]{display:none!important}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;--u:1;--ink:#3b1f4a;--m:calc(var(--u)*20px);--g:calc(var(--u)*12px);--h:calc(var(--u)*96px);background:#ffe9b8}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* HUD. One spacing system, in frame units (--u = frame width / 720):
   --m page margin and inner padding, --g gap between neighbours, --h height of a control.
   Three flex zones (.top, .mid, .bar) lay themselves out; nothing below is placed with a loose number. */
.hud{position:absolute;inset:0;pointer-events:none;color:var(--ink);--b:calc(var(--u)*4px);--sh:calc(var(--u)*8px);font-size:calc(var(--h)*.42);line-height:1}
.hud button{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink);margin:0;font-size:inherit;line-height:1}
.hud i{font-style:normal}
.hud.edit .top,.hud.edit .pill,.hud.edit .mid,.hud.edit .hand,.hud.edit .bar{display:none}
.out{--o:calc(var(--u)*4px);color:#fff;text-shadow:var(--o) 0 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),0 var(--o) 0 var(--ink),0 calc(var(--o)*-1) 0 var(--ink),var(--o) var(--o) 0 var(--ink),calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),0 calc(var(--o)*2) 0 var(--ink)}
.gloss{border:var(--b) solid #fff;background:linear-gradient(#fff 0,#fff7e3 48%,#ffecc2 52%,#ffdf9c 100%);box-shadow:0 calc(var(--sh)*.75) 0 #d99a4a,0 calc(var(--sh)*1.25) calc(var(--sh)*1.75) rgba(90,50,10,.25)}
/* words that shrink to their box: the game sets --k (ui.js fit) */
[data-fit]{display:block;min-width:0;white-space:nowrap;font-size:calc(var(--fs)*var(--k,1))}
/* an icon is a square box, centred as a box whatever the glyph inside */
.ic{flex:none;display:grid;place-items:center;width:var(--i);height:var(--i);font-size:calc(var(--i)*.86);line-height:1;--i:calc(var(--h)*.5)}
.ic svg{display:block;width:100%;height:100%}
.num{font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.pill{box-sizing:border-box;flex:none;height:var(--h);min-width:var(--h);display:flex;align-items:center;justify-content:center;gap:var(--g);padding:0 var(--m);border-radius:var(--h)}
.pill.sq{width:var(--h);padding:0}
/* top row: level and stars at the start, stickers and sound at the end */
.top{position:absolute;top:var(--m);left:var(--m);right:var(--m);height:var(--h);display:flex;align-items:center;gap:var(--g)}
.grow{flex:1 1 0;min-width:0}
/* under it, centred: the words, then the place of the sticker card */
.mid{position:absolute;top:calc(var(--m) + var(--h) + var(--g));left:var(--m);right:var(--m);display:flex;flex-direction:column;align-items:center;gap:var(--g)}
.prompt{width:100%;text-align:center;--fs:calc(var(--h)*.75);line-height:1.2}
.prompt.in{animation:u-pop .5s ease-out}
@keyframes u-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none}}
.slot{width:100%;height:var(--h);display:flex;justify-content:center}
.toast{box-sizing:border-box;height:var(--h);max-width:100%;display:flex;align-items:center;gap:var(--g);padding:0 var(--m);border-radius:var(--h);z-index:5}
.toast .ic{--i:calc(var(--h)*.7)}
.toast b{--fs:calc(var(--h)*.42)}
.toast.in{animation:t-in 1.7s ease-out forwards}
@keyframes t-in{0%{transform:scale(.3) rotate(-8deg);opacity:0}10%{transform:scale(1.12) rotate(3deg);opacity:1}18%{transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--m)*-1.5))}}
/* the swipe hint: a finger sliding across the rope (placed by the game over the rope) */
.hand{position:absolute;font-size:calc(var(--h)*1.15);line-height:1;margin:calc(var(--m)*-1) 0 0 calc(var(--h)*-.575);filter:drop-shadow(0 calc(var(--sh)*.75) calc(var(--sh)*.5) rgba(0,0,0,.3));animation:h-swipe 1.3s ease-in-out infinite;z-index:4}
@keyframes h-swipe{0%{transform:translateX(calc(var(--h)*-1.25)) rotate(-12deg);opacity:0}15%{opacity:1}75%{transform:translateX(calc(var(--h)*1.25)) rotate(12deg);opacity:1}100%{transform:translateX(calc(var(--h)*1.25)) rotate(12deg);opacity:0}}
.cheer{position:absolute;top:34%;left:var(--m);right:var(--m);text-align:center;--fs:calc(var(--h)*1.15);color:#fff06a;z-index:5}
.cheer.in{animation:c-in 1.1s ease-out forwards}
@keyframes c-in{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.2);opacity:1}32%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
/* after a win: the scene stays alive above this block; the bottom margin leaves room for the button's shadow */
.bar{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) + var(--sh));display:flex;flex-direction:column;align-items:center;gap:var(--g);animation:b-up .35s ease-out;z-index:6}
@keyframes b-up{0%{transform:translateY(60%);opacity:0}100%{transform:none;opacity:1}}
.got{box-sizing:border-box;height:calc(var(--h)*.75);max-width:100%;display:flex;align-items:center;gap:var(--m);padding:0 var(--m);border-radius:var(--h);direction:ltr}
.got .set{display:flex;align-items:center;gap:calc(var(--g)*.5)}
.got .ic{--i:calc(var(--h)*.45)}
.btns{width:100%;display:flex;align-items:stretch;gap:var(--g);height:calc(var(--h)*1.25)}
.again{box-sizing:border-box;flex:0 1 auto;min-width:calc(var(--h)*1.25);max-width:45%;display:flex;align-items:center;justify-content:center;gap:var(--g);padding:0 var(--m);border-radius:var(--h)}
.again b{--fs:calc(var(--h)*.36)}
.next{box-sizing:border-box;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:var(--g);padding:0 var(--m);border-radius:var(--h);color:#fff!important;border:var(--b) solid #fff!important;background:linear-gradient(#8ff0a6 0,#4fdc7c 48%,#2fcb62 52%,#1fb152 100%);box-shadow:0 var(--sh) 0 #158a3f,0 calc(var(--sh)*1.75) calc(var(--sh)*2.25) rgba(20,90,50,.35);text-shadow:0 calc(var(--b)*.75) 0 #158a3f;animation:n-pulse 1.1s ease-in-out infinite}
.next b{--fs:calc(var(--h)*.56)}
.next .ic{--i:calc(var(--h)*.56)}
@keyframes n-pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.hud *{animation-duration:.01s!important;animation-iteration-count:1!important}}
#load{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fff6d6,#ffd08a 70%);transition:opacity .3s}
#load.out{opacity:0;pointer-events:none}
#load i{width:min(22vmin,130px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff9a3c 40%,#d96f1a);border:min(1.4vmin,8px) solid #fff;animation:l-jig .7s ease-in-out infinite}
@keyframes l-jig{50%{transform:scale(1.15,.85) translateY(10%)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="load" aria-hidden="true"><i></i></div>
<script>
// the loader goes once the first frame is drawn; a script error never leaves it up for good
(function () { var el = document.getElementById('load'); window.__load = { done: function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 350); } }; addEventListener('error', function () { setTimeout(function () { if (document.getElementById('load')) window.__load.done(); }, 4000); }); })();
</script>

</html>
