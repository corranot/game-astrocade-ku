<!doctype html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>+1 Mega Hammer: Smash and Grow</title>
<!-- the rounded Baloo family: one look in Latin/Vietnamese, Devanagari, Bengali and Arabic -->
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5.1.0/800.css">
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-da-2@5.1.0/800.css">
<link rel="stylesheet" data-font href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-bhaijaan-2@5.1.0/800.css">
<style>
html,body{margin:0;height:100%;background:#23263a;overflow:hidden;font-family:"Baloo 2","Baloo Da 2","Baloo Bhaijaan 2","Arial Rounded MT Bold","Nunito","Noto Sans",system-ui,sans-serif;font-weight:800}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;--u:1;--ink:#23263a;--m:calc(var(--u)*22px);background:#2b2d5b;box-shadow:0 0 calc(var(--u)*60px) rgba(0,0,0,.45)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#f4ede2}
/* outlined game text for every script (stroke via shadows, not text-stroke) */
.out{--o:calc(var(--u)*4px);text-shadow:var(--o) 0 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),0 var(--o) 0 var(--ink),0 calc(var(--o)*-1) 0 var(--ink),var(--o) var(--o) 0 var(--ink),calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),0 calc(var(--o)*2) 0 var(--ink)}
/* the hammer size: a glossy vinyl pill, top centre */
.counter{position:absolute;top:var(--m);left:50%;translate:-50% 0;display:flex;align-items:center;gap:calc(var(--u)*10px);height:calc(var(--u)*96px);padding:0 calc(var(--u)*30px) 0 calc(var(--u)*14px);border-radius:999px;direction:ltr;
  background:linear-gradient(#3a3d75,#2b2d5b 55%,#22244a);border:calc(var(--u)*5px) solid var(--ink);box-shadow:inset 0 calc(var(--u)*5px) 0 rgba(244,237,226,.22),0 calc(var(--u)*7px) 0 var(--ink)}
.counter b{font-size:calc(var(--u)*62px);line-height:1;min-width:calc(var(--u)*60px);text-align:center;color:#f2c96a}
.counter.bump{animation:bump .28s ease-out}
.ham{position:relative;width:calc(var(--u)*66px);height:calc(var(--u)*66px);border-radius:50%;background:radial-gradient(circle at 38% 30%,#f6d58e,#e5a93c 55%,#b67a20);border:calc(var(--u)*4px) solid var(--ink)}
.ham::before{content:"";position:absolute;left:44%;top:30%;width:14%;height:58%;border-radius:calc(var(--u)*4px);background:#8e5a32;rotate:35deg;box-shadow:0 0 0 calc(var(--u)*2px) var(--ink)}
.ham::after{content:"";position:absolute;left:20%;top:16%;width:56%;height:28%;border-radius:calc(var(--u)*7px);background:#5b5f73;rotate:35deg;box-shadow:0 0 0 calc(var(--u)*3px) var(--ink),inset 0 calc(var(--u)*3px) 0 rgba(244,237,226,.35)}
.mult{font-style:normal;font-size:calc(var(--u)*34px);color:#e06356}
/* zone progress under the counter */
.prog{position:absolute;top:calc(var(--m) + var(--u)*118px);left:50%;translate:-50% 0;display:flex;align-items:center;gap:calc(var(--u)*10px);direction:ltr}
.zone{font-size:calc(var(--u)*30px)}
.prog i{display:block;width:calc(var(--u)*260px);height:calc(var(--u)*22px);border-radius:999px;background:rgba(35,38,58,.55);border:calc(var(--u)*4px) solid var(--ink);overflow:hidden}
.prog i b{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(#5fd3a6,#1f9d74);transition:width .2s}
.mute{position:absolute;top:var(--m);right:var(--m);width:calc(var(--u)*96px);height:calc(var(--u)*96px);border-radius:50%;pointer-events:auto;border:calc(var(--u)*5px) solid var(--ink);font-size:calc(var(--u)*40px);cursor:pointer;
  background:radial-gradient(circle at 38% 30%,#4a4d8a,#2b2d5b 70%);box-shadow:0 calc(var(--u)*6px) 0 var(--ink);-webkit-tap-highlight-color:transparent;padding:0}
[dir=rtl] .mute{right:auto;left:var(--m)}
/* +N numbers: pop up at the break, then fly to the counter */
.pop{position:absolute;translate:-50% -50%;font-size:calc(var(--u)*46px);color:#f2c96a;opacity:0;white-space:nowrap;direction:ltr}
.pop.big{font-size:calc(var(--u)*64px);color:#7fe0b4}
.pop.go{animation:fly .85s cubic-bezier(.3,0,.6,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:1;transform:translate(0,calc(var(--u)*-50px)) scale(1.25)}35%{transform:translate(0,calc(var(--u)*-70px)) scale(1)}100%{opacity:.85;transform:translate(var(--dx),var(--dy)) scale(.45)}}
.banner{position:absolute;top:30%;left:50%;translate:-50% -50%;font-size:calc(var(--u)*86px);white-space:nowrap;opacity:0;color:#f2c96a}
.banner.jade{color:#7fe0b4}
.banner.show{animation:ban 1.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.3) rotate(-6deg)}14%{opacity:1;transform:scale(1.15) rotate(2deg)}24%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(calc(var(--u)*-40px))}}
.hint{position:absolute;bottom:18%;left:50%;translate:-50% 0;font-size:calc(var(--u)*58px);white-space:nowrap;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bump{40%{transform:scale(1.14)}100%{transform:none}}
/* results card: shown at the end of a run once the session is 60 s or longer */
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(circle at 50% 45%,rgba(43,45,91,.35),rgba(20,21,40,.78));opacity:0;transition:opacity .35s}
.card.show{opacity:1}
.card[hidden]{display:none}
.cbox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14px);width:calc(var(--u)*560px);padding:calc(var(--u)*40px) calc(var(--u)*30px);border-radius:calc(var(--u)*56px);
  background:linear-gradient(#3a3d75,#2b2d5b 60%,#22244a);border:calc(var(--u)*6px) solid var(--ink);box-shadow:inset 0 calc(var(--u)*6px) 0 rgba(244,237,226,.2),0 calc(var(--u)*12px) 0 var(--ink);transform:scale(.6) rotate(-4deg);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.card.show .cbox{transform:none}
.ctitle{margin:0;font-size:calc(var(--u)*44px);color:#f4ede2;text-align:center}
.ham.big{width:calc(var(--u)*130px);height:calc(var(--u)*130px);animation:pulse 1.2s ease-in-out infinite}
.csize{font-size:calc(var(--u)*130px);line-height:1;color:#f2c96a;direction:ltr}
.cgem{display:flex;align-items:center;gap:calc(var(--u)*10px);font-size:calc(var(--u)*44px);color:#f4ede2;direction:ltr}
.gemi{display:block;width:calc(var(--u)*40px);height:calc(var(--u)*40px);rotate:45deg;border-radius:calc(var(--u)*6px);background:linear-gradient(135deg,#ffd0e0,#ff5d8f 45%,#b8326a);border:calc(var(--u)*4px) solid var(--ink);box-shadow:inset calc(var(--u)*4px) calc(var(--u)*4px) 0 rgba(255,255,255,.45)}
.cbest{margin:0;font-size:calc(var(--u)*34px);color:#7fe0b4}
.cbtn{width:100%;min-height:calc(var(--u)*110px);border-radius:999px;border:calc(var(--u)*6px) solid var(--ink);font:inherit;font-size:calc(var(--u)*48px);color:#f4ede2;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(#f07a6c,#e06356 55%,#b8463b);box-shadow:inset 0 calc(var(--u)*6px) 0 rgba(255,255,255,.3),0 calc(var(--u)*8px) 0 var(--ink)}
.cbtn:active{translate:0 calc(var(--u)*6px);box-shadow:inset 0 calc(var(--u)*6px) 0 rgba(255,255,255,.3),0 calc(var(--u)*2px) 0 var(--ink)}
.cbtn.alt{min-height:calc(var(--u)*86px);font-size:calc(var(--u)*38px);background:linear-gradient(#6fdcb2,#1f9d74 60%,#167a5a)}
.cbtn[hidden]{display:none}
.retry{position:absolute;inset:0;margin:auto;width:40%;aspect-ratio:1;border-radius:50%;border:1.2vmin solid #f4ede2;background:#e06356;color:#f4ede2;font:inherit;font-size:14vmin;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.retry small{font-size:3.5vmin;opacity:.8}
@media (prefers-reduced-motion:reduce){.hint,.ham.big{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// never a dead end: no picture after a script error (4 s), after 12 s waiting for the 3D library (code LIB), or when
// WebGL fails (code GL, from game.js), a retry button with the reason code takes the screen
(function () {
  var shown = false;
  function fail(code) {
    if (shown || (code !== 'GL' && document.querySelector('#app canvas'))) return; shown = true;
    var app = document.getElementById('app');
    app.innerHTML = '<button class="retry" aria-label="Retry">\u21bb<small>' + code + '</small></button>';
    app.querySelector('button').onclick = function () { location.reload(); };
  }
  window.__load = { done: function () {}, fail: fail };
  addEventListener('error', function () { setTimeout(function () { fail('ERR'); }, 4000); });
  setTimeout(function () { fail('LIB'); }, 12000);
})();
</script>
