// ---------------------------------------------------------------- Particles
/** One pooled point cloud: stars, hearts, dust, confetti, sun motes. */
class Particles {
  constructor(scene, n) {

    geo.setAttribute('palpha', new THREE.BufferAttribute(this.a, 1).setUsage(THREE.DynamicDrawUsage));

// ---------------------------------------------------------------- WorldBuilder
/** Collects many static pieces into one vertex-coloured mesh (one draw call). */

  }
}

// ---------------------------------------------------------------- Orbs
/** Glowing yarn orbs: collected on touch, pulled in during MEGA ZOOMIES, back after a short while. Two draw calls. */
class Orbs {
  constructor(scene, cfg) {
    this.scene = scene; this.cfg = cfg;
    this.list = cfg.orbs.spots.map(([x, y, z], i) => ({ hx: x, hy: y, hz: z, x, y, z, on: true, t: 0, ph: i * 1.7, pop: 1, color: i % YARN_COLORS.length }));
    const n = this.list.length;
    this.geo = new THREE.SphereGeometry(0.3, 14, 10);
    this.tex = canvasTex(128, 64, (g, w, h) => {
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 3;
      for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, i * 9 - 20); g.bezierCurveTo(w * 0.3, i * 9 + 14, w * 0.7, i * 9 - 24, w, i * 9 - 20); g.stroke(); }
    });
    this.mat = new THREE.MeshBasicMaterial({ map: this.tex });
    this.glowMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.2, depthWrite: false, blending: THREE.AdditiveBlending });
    this.core = new THREE.InstancedMesh(this.geo, this.mat, n); this.glow = new THREE.InstancedMesh(this.geo, this.glowMat, n);
    this.core.frustumCulled = false; this.glow.frustumCulled = false; this.glow.renderOrder = 4;
    const c = new THREE.Color();
    this.list.forEach((o, i) => { c.set(YARN_COLORS[o.color]); this.core.setColorAt(i, c); this.glow.setColorAt(i, c); });
    scene.add(this.core, this.glow);
    this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.e = new THREE.Euler(); this.p = new THREE.Vector3(); this.s = new THREE.Vector3();
  }
  /** magnet: pull radius in metres, 0 when off. Collected orbs are reported through ev. */
  update(dt, t, cat, magnet, ev) {
    const C = this.cfg.orbs, cy = cat.y + 0.5, pull = this.cfg.fever.magnetSpeed * dt;
    for (let i = 0; i < this.list.length; i++) {
      const o = this.list[i];
      if (!o.on) { o.t -= dt; if (o.t <= 0) { o.on = true; o.x = o.hx; o.y = o.hy; o.z = o.hz; o.pop = 0; } }

    }

  dispose() { this.scene.remove(this.core, this.glow); this.core.dispose(); this.glow.dispose(); this.geo.dispose(); this.tex.dispose(); this.mat.dispose(); this.glowMat.dispose(); }
}

// ---------------------------------------------------------------- Dominoes
/** A row of standing books that topple one into the next when touched, and stand up again later. One draw call. */
class Dominoes {
  constructor(scene, cfg) {
    const D = cfg.dominoes; this.scene = scene; this.D = D; this.list = [];
    this.dx = Math.sin(D.yaw); this.dz = Math.cos(D.yaw);
    // st: 0 standing, 1 about to fall, 2 falling, 3 down, 4 standing up
    for (let i = 0; i < D.count; i++) this.list.push({ x: D.x + this.dx * i * D.gap, z: D.z + this.dz * i * D.gap, ang: 0, v: 0, st: 0, wait: 0, dir: 1, down: 0, passed: false });
    this.geo = new THREE.BoxGeometry(0.62, 0.95, 0.13); this.geo.translate(0, 0.475, 0);
    this.mat = new THREE.MeshStandardMaterial({ roughness: 0.55 });
    this.mesh = new THREE.InstancedMesh(this.geo, this.mat, D.count); this.mesh.castShadow = true; this.mesh.receiveShadow = true; this.mesh.frustumCulled = false;
    const c = new THREE.Color();
    for (let i = 0; i < D.count; i++) this.mesh.setColorAt(i, c.set(CONFETTI[i % CONFETTI.length]));
    scene.add(this.mesh);
    this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.e = new THREE.Euler(0, 0, 0, 'YXZ'); this.p = new THREE.Vector3(); this.one = new THREE.Vector3(1, 1, 1);

  hit(x, z, r) { this.list.forEach((d, i) => { const ox = d.x - x, oz = d.z - z; if (Math.hypot(ox, oz) < r) this.push(i, ox * this.dx + oz * this.dz >= 0 ? 1 : -1); }); }
  /** pushers: bodies ({x,y,z,r}) that knock a book over by touching it. */
  update(dt, pushers, cat, ev) {
    let moved = false;
    for (let i = 0; i < this.list.length; i++) {
      const d = this.list[i];
      if (d.st === 0) { for (const p of pushers) { if (p.y > 0.9) continue; const ox = d.x - p.x, oz = d.z - p.z; if (Math.hypot(ox, oz) < p.r + 0.2) this.push(i, ox * this.dx + oz * this.dz >= 0 ? 1 : -1); } continue; }

      } else if (d.st === 3) { d.down += dt; if (d.down > this.D.reset && Math.hypot(cat.x - d.x, cat.z - d.z) > 5) d.st = 4; }
      else { d.ang -= dt * 3; if (d.ang <= 0) { d.ang = 0; d.v = 0; d.st = 0; d.passed = false; } }

  }

    this.list.forEach((d, i) => { this.q.setFromEuler(this.e.set(d.ang * d.dir, this.D.yaw, 0)); this.m.compose(this.p.set(d.x, 0, d.z), this.q, this.one); this.mesh.setMatrixAt(i, this.m); });

  }
  dispose() { this.scene.remove(this.mesh); this.mesh.dispose(); this.geo.dispose(); this.mat.dispose(); }
}

// ---------------------------------------------------------------- PawPrints
/** Pooled paw-print decals that fade out; all in one mesh. */
class PawPrints {
  constructor(scene, n) {
    this.scene = scene; this.n = n; this.i = 0; this.life = new Float32Array(n); this.live = false;
    this.pos = new Float32Array(n * 12); this.col = new Float32Array(n * 16);
    const uv = new Float32Array(n * 8), idx = [];
    for (let k = 0; k < n; k++) { uv.set([0, 0, 0, 1, 1, 1, 1, 0], k * 8); const b = k * 4; idx.push(b, b + 1, b + 2, b, b + 2, b + 3); }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 4).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); this.geo.setIndex(idx);
    this.tex = canvasTex(64, 64, (g) => {
      g.fillStyle = '#ffffff';
      g.beginPath(); g.ellipse(32, 42, 14, 12, 0, 0, TAU); g.fill();
      for (const [x, y] of [[14, 26], [25, 15], [39, 15], [50, 26]]) { g.beginPath(); g.arc(x, y, 6.5, 0, TAU); g.fill(); }
    });
    this.mat = new THREE.MeshBasicMaterial({ map: this.tex, vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    this.mesh = new THREE.Mesh(this.geo, this.mat); this.mesh.frustumCulled = false; this.mesh.renderOrder = 2; scene.add(this.mesh);
    this.c = new THREE.Color();
  }
  stamp(x, y, z, yaw, color) {
    const k = this.i; this.i = (this.i + 1) % this.n;
    // the canvas top (the toes) is v = 1, so local +z (forward) carries the toes
    const s = 0.15, cs = Math.cos(yaw), sn = Math.sin(yaw), L = [[-s, -s], [-s, s], [s, s], [s, -s]];
    L.forEach(([lx, lz], j) => { this.pos[k * 12 + j * 3] = x + lx * cs + lz * sn; this.pos[k * 12 + j * 3 + 1] = y; this.pos[k * 12 + j * 3 + 2] = z - lx * sn + lz * cs; });
    this.c.set(color);
    for (let j = 0; j < 4; j++) { this.col[k * 16 + j * 4] = this.c.r; this.col[k * 16 + j * 4 + 1] = this.c.g; this.col[k * 16 + j * 4 + 2] = this.c.b; this.col[k * 16 + j * 4 + 3] = 0.7; }

      if (this.life[k] <= 0) continue;
      this.life[k] = Math.max(0, this.life[k] - dt / 3.5);
      const a = Math.min(0.7, this.life[k] * 1.4);
      for (let j = 0; j < 4; j++) this.col[k * 16 + j * 4 + 3] = a;
      if (this.life[k] > 0) this.live = true;
    }
    this.geo.attributes.color.needsUpdate = true;
  }
  dispose() { this.scene.remove(this.mesh); this.geo.dispose(); this.tex.dispose(); this.mat.dispose(); }
}

// ---------------------------------------------------------------- Ribbon
/** Rainbow comet ribbon behind the tail during MEGA ZOOMIES: one strip with a fixed buffer. */
class Ribbon {
  constructor(scene, n) {
    this.scene = scene; this.n = n; this.fade = 0;
    this.pos = new Float32Array(n * 6); this.col = new Float32Array(n * 8);
    const idx = [];
    for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 4).setUsage(THREE.DynamicDrawUsage));
    this.geo.setIndex(idx);
    this.mat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    this.mesh = new THREE.Mesh(this.geo, this.mat); this.mesh.frustumCulled = false; this.mesh.visible = false; this.mesh.renderOrder = 3; scene.add(this.mesh);
    this.c = new THREE.Color();
  }
  reset(x, y, z) { for (let i = 0; i < this.n * 2; i++) { this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z; } }
  /** Adds the newest point (x,y,z) with its sideways direction (sx,sz); on = the fever is running. */
  update(dt, t, x, y, z, sx, sz, on) {
    this.fade = clamp(this.fade + (on ? dt * 6 : -dt * 2.5), 0, 1);
    this.mesh.visible = this.fade > 0;
    if (!this.mesh.visible) return;
    const w = 0.24;
    this.pos.copyWithin(6, 0, (this.n - 1) * 6);
    this.pos[0] = x - sx * w; this.pos[1] = y; this.pos[2] = z - sz * w; this.pos[3] = x + sx * w; this.pos[4] = y; this.pos[5] = z + sz * w;
    for (let i = 0; i < this.n; i++) {
      this.c.setHSL((t * 0.9 + i / this.n * 2) % 1, 1, 0.6);
      const a = (1 - i / (this.n - 1)) * 0.85 * this.fade;
      for (let j = 0; j < 2; j++) { const o = (i * 2 + j) * 4; this.col[o] = this.c.r; this.col[o + 1] = this.c.g; this.col[o + 2] = this.c.b; this.col[o + 3] = a; }
    }
    this.geo.attributes.position.needsUpdate = true; this.geo.attributes.color.needsUpdate = true;
  }
  dispose() { this.scene.remove(this.mesh); this.geo.dispose(); this.mat.dispose(); }
}

    const dx = this.demoGoal.x - c.x, dz = this.demoGoal.z - c.z, d = Math.hypot(dx, dz);
    if (d < 0.6) this.demoT = 0;
    return d > 0.6 ? { x: dx / d * 0.8, z: dz / d * 0.8, fwd: false } : { x: 0, z: 0, fwd: false };
  }
  update(dt) {
    this.now += dt;
    const c = this.cat, C = this.cfg, play = this.mode === 'play', ev = [];
    let mv = { x: 0, z: 0, fwd: false };
    if (play) mv = this.demo ? this.demoThink(dt) : this.readMove();
    if (play && c.tryJump(this.now)) this.onJump();
    this.updateRobot(dt);
    const land = c.step(dt, mv.x, mv.z, this.world.colliders, this.now);
    // the ceiling
    const top = C.room.height - 1.3;
    if (c.y > top) { c.y = top; c.vy = Math.min(c.vy, 0); }
    if (land) this.onLand(land);
    c.animate(dt);
    this.pushProps();
    this.props.update(dt);
    this.handleProps();
    this.orbs.update(dt, this.now, c, this.fever > 0 ? C.fever.magnet : 0, ev);
    this.pusher.x = c.x; this.pusher.y = c.y; this.pusher.z = c.z;
    this.dominoes.update(dt, this.pushers, c, ev);
    for (const e of ev) this.onPickup(e);
    this.updatePiano(dt);
    this.updateFish(dt);
    this.updateEvents(dt);
    // MEGA ZOOMIES
    if (this.fever > 0) {
      this.fever -= dt;
      if (Math.random() < dt * 30) this.fx.emit(c.x, c.y + 0.4, c.z, 1, { color: ['#ffe14d', '#ffffff', '#ff9ef0'], kind: 1, speed: 1.5, up: 1.5, life: 0.7, size: 0.3, g: 1 });
      if (this.fever <= 0) this.endFever();
    }
    const tip = this.tailTip();
    this.ribbon.update(dt, this.now, tip.x, tip.y, tip.z, Math.cos(c.yaw), -Math.sin(c.yaw), this.fever > 0);
    this.comboT = Math.max(0, this.comboT - dt);
    this.updatePaws(dt, mv);
    this.updateRings(dt);
    // dust motes drifting in the sunbeam
    this.moteT -= dt;
    if (this.moteT <= 0) { this.moteT = 0.22; this.fx.emit(rand(-11, -4.5), rand(0.6, 6), rand(2.5, 7.5), 1, { color: '#fff3c4', speed: 0.2, up: 0.08, life: 5, size: 0.09, g: 0.03 }); }
    this.fx.update(dt);
    if (this.demo) { this.rig.yaw += dt * 0.22; this.rig.dragT = 0; }
    this.rig.update(dt, c, mv.fwd && Math.hypot(c.vx, c.vz) > 1, this.now < 0.05, this.world, this.props.list);
    // wider view during the fever, and a small lean into turns
    const cam = this.camera, fov = this.fever > 0 ? C.camera.fovFever : C.camera.fov;
    if (Math.abs(cam.fov - fov) > 0.05) { cam.fov = lerp(cam.fov, fov, damp(4, dt)); cam.updateProjectionMatrix(); }
    const turn = angDiff(this.lastYaw, c.yaw) / dt; this.lastYaw = c.yaw;
    this.tilt = lerp(this.tilt, this.reduced || this.demo ? 0 : clamp(-turn * 0.008, -C.camera.tilt, C.camera.tilt), damp(4, dt));
    cam.rotateZ(this.tilt);
    this.sun.position.set(c.x - 9, 15, c.z + 6); this.sun.target.position.set(c.x, 0, c.z);
    this.ui.updateFloats(dt, cam, this.w || 1, this.h || 1);
    this.ui.purr(this.fever > 0 ? this.fever / C.fever.time : this.purr / C.purr.max, this.fever > 0);
    // a kitten left alone purrs
    this.idleT = Math.hypot(mv.x, mv.z) > 0.1 || !c.grounded ? 0 : this.idleT + dt;
    if (this.idleT > 5 && !this.demo) { this.idleT = -3; this.audio.purr(); this.fx.emit(c.x, c.y + 1.2, c.z, 3, { color: ['#ff6f91', '#ff9ec4'], kind: 2, speed: 0.6, up: 1.4, life: 1.4, size: 0.42, g: 0.5 }); }
    if (play && !this.demo) this.audio.music();
    if (this.saveDue && this.now >= this.saveDue) this.flushSave();
  }
  onPickup(e) {
    const Sc = this.cfg.score;
    if (e.type === 'orb') {
      this.orbStreak = this.now - this.orbT < 1.6 ? this.orbStreak + 1 : 0; this.orbT = this.now;
      this.audio.chime(this.orbStreak); if (this.orbStreak % 4 === 3) this.audio.sparkle();
      this.fx.emit(e.x, e.y, e.z, 9, { color: [YARN_COLORS[e.color], '#ffffff'], kind: 1, speed: 2.6, up: 2.5, life: 0.7, size: 0.32 });
      this.gain(Sc.orb, e.x, e.y + 0.4, e.z); this.addPurr(this.cfg.purr.orb);
    } else if (e.type === 'domino') {
      this.audio.clack(0.7);
      this.fx.emit(e.x, 0.2, e.z, 4, { color: '#ffffff', speed: 1.6, up: 1.2, life: 0.4, size: 0.24 });
      this.gain(Sc.domino, e.x, 0.9, e.z); this.addPurr(this.cfg.purr.bat);
    }
  }
  /** The floor piano: a key sounds once each time Mochi steps onto it. */
  updatePiano(dt) {
    const P = this.cfg.piano, c = this.cat, K = this.world.pianoKeys;
    let i = -1;
    if (c.grounded && c.y < 0.1 && c.z > P.z0 && c.z < P.z1) { i = Math.floor((c.x - P.x0) / P.key); if (i < 0 || i >= K.length) i = -1; }
    if (i !== this.keyOn) {
      this.keyOn = i;
      if (i >= 0) {
        const k = K[i];
        this.audio.piano(P.notes[i]); k.t = 1;
        this.pianoLog.push(i); if (this.pianoLog.length > 32) this.pianoLog.shift();
        this.fx.emit(k.m.position.x, 0.2, c.z, 4, { color: '#' + k.m.material.color.getHexString(), kind: 1, speed: 1.5, up: 3, life: 0.6, size: 0.3 });
        if (this.now - k.last > P.cooldown) { k.last = this.now; this.gain(this.cfg.score.piano, k.m.position.x, 0.9, c.z); this.addPurr(this.cfg.purr.bat); }
      }
    }
    for (const k of K) {
      if (k.t <= 0) continue;
      k.t = Math.max(0, k.t - dt * 2.2); k.m.visible = k.t > 0; k.m.material.opacity = k.t * 0.8;
    }
  }
  /** Paw prints behind a running kitten: dusty normally, golden during the fever. */
  updatePaws(dt, mv) {
    const c = this.cat;
    if (c.grounded) {
      this.stepDist += Math.hypot(c.vx, c.vz) * dt;
      if (this.stepDist > 0.55) {
        this.stepDist = 0; this.pawSide = -this.pawSide;
        this.paws.stamp(c.x + Math.cos(c.yaw) * 0.16 * this.pawSide, c.y + 0.025, c.z - Math.sin(c.yaw) * 0.16 * this.pawSide, c.yaw, this.fever > 0 ? '#ffd23f' : '#9a6a45');
      }
    }
    this.paws.update(dt);
  }
  onLand(e) {
    const c = this.cat;
    if (e.bounce) {
      this.audio.boing(e.bounce === 'whale' ? 0.8 : 1.1);
      if (e.bounce === 'whale' && this.event && this.event.kind === 'bubbles') c.vy = this.cfg.bounce.whaleEvent;
      this.fx.emit(c.x, c.y + 0.1, c.z, 14, { color: e.bounce === 'whale' ? ['#6fd3ff', '#ffffff'] : ['#ffffff', '#ffd9b0'], speed: 3, up: 3, life: 0.6, size: 0.3, kind: e.bounce === 'whale' ? 0 : 1 });
      buzz('tap');
    } else if (e.soft) {
      this.audio.squeak(); this.rig.shake(0.2);
      this.fx.emit(c.x, c.y + 0.05, c.z, 18, { color: ['#ffffff', '#ffe27a'], kind: 1, speed: 3.5, up: 3, life: 0.8, size: 0.35 });
    } else if (e.speed > 4) {
      this.audio.thud(e.speed / 12);
      this.fx.emit(c.x, c.y + 0.05, c.z, 8, { color: '#e9d2b4', speed: 2.2, up: 1.2, life: 0.5, size: 0.28 });
    }
    // a landing from high up sends a ring across the ground
    if (e.fall > 1.4 || this.pounceTarget) this.shock(c.x, c.y + 0.05, c.z, 0xffffff, clamp(e.fall * 1.6, 2.4, 6));
    // a pounce that lands next to a toy bats it
    const p = this.pounceTarget; this.pounceTarget = null;
    if (p) {
      const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz) || 1, pw = this.cfg.cat.swipePower;
      if (d < 1.6 + p.r && Math.abs(p.y - c.y) < 1.5) { p.hotT = this.now; this.props.impulse(p, dx / d * pw, 3.5, dz / d * pw); this.bat(p); }
    }
  }
  /** The kitten shoves the toys it runs into; during the fever it sends them flying. */
  pushProps() {
    const c = this.cat, C = this.cfg, fv = this.fever > 0 ? C.fever.push : 1;
    for (const p of this.props.list) {
      const py = p.y + p.k.hh;
      if (py < c.y - 0.3 || p.y > c.y + C.cat.height) continue;
      const hx = c.x + Math.sin(c.yaw) * C.cat.headReach, hz = c.z + Math.cos(c.yaw) * C.cat.headReach;
      let dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = C.cat.radius + p.r;
      const hdx = p.x - hx, hdz = p.z - hz, hd = Math.hypot(hdx, hdz), hm = C.cat.headRadius + p.r;
      if (d >= m && hd < hm) { dx = hdx; dz = hdz; d = hd; m = hm; }
      if (d >= m || d < 1e-4) continue;
      const nx = dx / d, nz = dz / d, rel = c.vx * nx + c.vz * nz - (p.vx * nx + p.vz * nz);
      p.hotT = this.now;
      this.props.wake(p);
      p.x += nx * (m - d) * 0.8; p.z += nz * (m - d) * 0.8;
      if (rel > 0) {
        const k = 1.3 * fv / Math.sqrt(p.k.mass); p.vx += nx * rel * k; p.vz += nz * rel * k; p.vy += rel * 0.25 * fv;
        // capped so a fever shove cannot carry a toy through a wall in one step
        const sp = Math.hypot(p.vx, p.vz), mx = C.props.maxPush;
        if (sp > mx) { p.vx *= mx / sp; p.vz *= mx / sp; }
        p.vy = Math.min(p.vy, mx * 0.5);
      }
      if (rel > C.props.pushStar || (fv > 1 && rel > 0.5)) this.bat(p);
    }
  }
  handleProps() {
    const ev = this.props.events, C = this.cfg, cat = this.cat;
    for (const e of ev) {
      if (e.type === 'land' || e.type === 'clack') {
        const snd = e.p.k.sound, k = clamp(e.speed / 10, 0, 1);
        if (snd === 'boing') this.audio.boing(1.3); else if (snd === 'wood') this.audio.clack(k); else this.audio.thud(k * 0.6);
        if (e.type === 'land' && e.speed > 5) this.fx.emit(e.p.x, e.p.y + 0.05, e.p.z, 5, { color: '#e9d2b4', speed: 1.8, up: 1, life: 0.4, size: 0.24 });
      } else if (e.type === 'knock') this.knock(e);
      else if (e.type === 'poof') this.fx.emit(e.x, e.y + 0.3, e.z, 10, { color: ['#ffffff', '#ffe9f5'], speed: 1.5, up: 2, life: 0.7, size: 0.4, g: 1 });
    }
    ev.length = 0;
    // toys left on the floor far from home go back, so there is always something to knock down
    for (const p of this.props.list) {
      if (p.asleep && p.floorT > C.props.tidyAfter && Math.hypot(p.x - p.home.x, p.z - p.home.z) > 2 && Math.hypot(p.x - cat.x, p.z - cat.z) > C.props.tidyFar) this.props.sendHome(p, true);
    }
  }
  render() {
    // the camera keeps out of toys (CameraRig.unblock); one still around the lens is skipped rather than cut open
    const cp = this.camera.position;
    for (const p of this.props.list) p.mesh.visible = Math.hypot(p.x - cp.x, p.y + p.k.hh - cp.y, p.z - cp.z) > p.r + 0.12;
    this.renderer.render(this.scene, this.camera);
  }
  /** Quality steps down on slow devices: resolution, then shadows, then particles. */
  tunePerf(raw) {
    const P = this.perf;
    if (raw <= 0 || raw > 0.5 || this.now < 2) return;
    P.acc += raw; P.n++;
    if (P.acc < 1.5) return;
    const fps = P.n / P.acc; P.acc = 0; P.n = 0; P.fps = fps;
    P.slow = fps < 38 ? P.slow + 1 : 0;
    if (P.slow >= 2 && P.tier > 0) {
      P.slow = 0; P.tier--;
      if (P.tier === 1) { this.dpr = Math.max(0.75, this.dpr * 0.75); this.renderer.setPixelRatio(this.dpr); this.fit(); }
      else {
        this.renderer.shadowMap.enabled = false; this.sun.castShadow = false; this.fx.limit = this.fx.n / 2; this.dpr = Math.max(0.6, this.dpr * 0.85); this.renderer.setPixelRatio(this.dpr); this.fit();
        this.scene.traverse((o) => { if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; for (const m of ms) m.needsUpdate = true; } });
      }
    }
  }
  fit() {
    const r = this.root.getBoundingClientRect(), w = Math.max(1, r.width), h = Math.max(1, r.height);
    this.w = w; this.h = h;
    this.root.style.setProperty('--u', String(w / 720));
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
    this.fx.mat.uniforms.scale.value = h * this.dpr * 0.5;
    if (this.restBase) this.restBase();
    this.ui.fitTitle();
  }
  makeDebug() {
    const g = this;
    return {
      get S() { return g.S; }, get cat() { return g.cat; }, get props() { return g.props.list; }, get world() { return g.world; }, get orbs() { return g.orbs.list; },
      get dominoes() { return g.dominoes.list; }, get fish() { return g.fish; }, get robot() { return g.robot; }, get event() { return g.event; }, get piano() { return g.pianoLog; },
      get state() { return { demo: g.demo, started: g.started, loaded: g.loaded, stars: g.stars, purr: g.purr, fever: g.fever, combo: g.combo, hats: g.hatN, worn: g.cat.wearKey, event: g.event ? g.event.kind : null, tier: g.perf.tier, fps: g.perf.fps, now: g.now, fov: g.camera.fov, tilt: g.tilt, freeze: g.freeze }; },
      tp(x, y, z) { const c = g.cat; c.x = x; c.y = y; c.z = z; c.vx = c.vy = c.vz = 0; c.py = y; c.pounce = null; },
      give(n) { g.gain(n); }, addPurr(n) { g.addPurr(n); }, eventNow(kind) { if (g.event) g.endEvent(); g.startEvent(kind); }, swipe() { g.swipe(); },
      info() { return { geometries: g.renderer.info.memory.geometries, textures: g.renderer.info.memory.textures, calls: g.renderer.info.render.calls, tris: g.renderer.info.render.triangles }; },
      setYaw(y) { g.rig.yaw = y; g.rig.dragT = 0; },
      tailTip() { const v = new THREE.Vector3(); g.cat.tail[5].getWorldPosition(v); return { x: v.x, y: v.y, z: v.z }; },
      headTip() { const v = new THREE.Vector3(0, 0, 0.36); g.cat.head.localToWorld(v); return { x: v.x, y: v.y, z: v.z }; },
      get cam() { const c = g.camera.position, t = g.rig.target; return { x: c.x, y: c.y, z: c.z, tx: t.x, ty: t.y, tz: t.z }; },
      get input() { return g.input; },
    };
  }
  destroy() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    this.flushSave();
    for (const [el, ev, fn, o] of this.listeners || []) el.removeEventListener(ev, fn, o);
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('visibilitychange', this.onVis);
    this.audio.close();
    this.props.dispose(); this.cat.dispose(); this.world.dispose(); this.orbs.dispose(); this.dominoes.dispose(); this.paws.dispose(); this.ribbon.dispose();
    this.bubbleMesh.dispose();
    this.fx.geo.dispose(); this.fx.mat.dispose();
    for (const d of this.disposables) d.dispose();
    this.renderer.dispose(); try { this.renderer.forceContextLoss(); } catch (e) { /* already gone */ }
    this.root.innerHTML = '';
  }
}

window.run = run;


run('play');
</script>
