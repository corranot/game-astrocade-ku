/* ---- one design system for the result card, the shop, the album and the settings.

   green = the way forward (primary, a price that can be paid), white-blue = quiet (secondary, icon buttons, tabs),
   yellow = the one that is picked, grey = not yet, pink = free. */
.ico{display:block;flex:none;width:var(--i2);height:var(--i2);overflow:visible}
