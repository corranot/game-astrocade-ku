.mcard.look .mtag{justify-self:auto;margin-top:calc(var(--u)*6px);font-size:calc(var(--u)*22px);padding:calc(var(--u)*2px) calc(var(--u)*10px)}
.swatch{display:block;width:calc(var(--u)*58px);height:calc(var(--u)*58px);border-radius:50%;border:calc(var(--u)*4px) solid var(--ink);box-shadow:inset 0 calc(var(--u)*6px) 0 rgba(255,255,255,.45)}
.mcard.on{background:linear-gradient(#e3fff6,#a8f0d8) !important}.mcard.on .mtag{background:linear-gradient(#7ff0d2,#22c6a3);color:#fff}
.mcard.afford .mtag{background:linear-gradient(#fff3b0,#ffc531)}.mcard.afford{animation:pulse 1.2s ease-in-out infinite}
.mcard.lock{filter:saturate(.35);opacity:.8}
.mcard.basic .mtag{background:linear-gradient(#e3fff6,#a8f0d8)}
.mcard.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(calc(var(--u)*-12px))}40%,80%{transform:translateX(calc(var(--u)*12px))}}
.mcard.bought{animation:card .5s cubic-bezier(.3,1.6,.5,1)}
.shop .again{margin-top:calc(var(--u)*6px)}
[hidden]{display:none !important}
/* result: compact so card, city map and buttons fit a phone even with a two-line title and the top 3; scrolls if not */
.result{gap:calc(var(--u)*30px);justify-content:safe center;overflow-y:auto;padding:calc(var(--u)*24px) 0}
.result .card{padding:calc(var(--u)*20px) calc(var(--u)*40px)}
.result h2{font-size:calc(var(--u)*52px)}
.result .stars{font-size:calc(var(--u)*76px);line-height:1.05}
.result .smash b{font-size:calc(var(--u)*80px)}
.result .again{font-size:calc(var(--u)*48px) !important;padding:calc(var(--u)*20px) calc(var(--u)*64px)}
.result .endbtns{gap:calc(var(--u)*18px)}
.result .board{font-size:calc(var(--u)*24px);margin-top:calc(var(--u)*8px)}
.result .board li{padding:0}
.gday{color:#ff5fa2;font-weight:900;font-size:calc(var(--u)*46px);--o:calc(var(--u)*3px)}
.gdays{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u)*8px);width:100%}
.gd{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2px);padding:calc(var(--u)*8px) 0;border-radius:calc(var(--u)*16px);background:#efe9ff;border:calc(var(--u)*3px) dashed #c9bfe0;font-weight:900}
.gd i{font-style:normal;font-size:calc(var(--u)*22px);color:#7a5fae}
.gd b{font-size:calc(var(--u)*22px);color:#c98a00}
.gd.got{background:#e3fff6;border-style:solid;border-color:#22c6a3}
.gd.now{background:linear-gradient(#fff3b0,#ffc531);border:calc(var(--u)*4px) solid var(--ink);transform:scale(1.12);animation:pulse 1s ease-in-out infinite}
.dbonus{margin-inline-start:calc(var(--u)*12px);font-size:calc(var(--u)*26px);color:#22c6a3}
.city.daily{background:linear-gradient(#e3fff6,#a8f0d8) !important}
.city.daily.on{background:linear-gradient(#fff3b0,#ffc531) !important}
</style>
