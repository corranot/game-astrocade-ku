<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Toy City Stomp: Giant Monster Smash</title>
<style>
html,body{margin:0;height:100%;background:#bfe8ff;overflow:hidden;font-family:"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;--u:1}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#2a2140;font-size:calc(var(--u)*30px)}
.hud button{pointer-events:auto;font:inherit;border:0;cursor:pointer}
.top{position:absolute;top:calc(var(--u)*24px);left:calc(var(--u)*20px);right:calc(var(--u)*20px);display:flex;align-items:center;gap:calc(var(--u)*12px)}
.coins{display:flex;align-items:center;gap:calc(var(--u)*8px);background:#fff;border:calc(var(--u)*5px) solid #2a2140;border-radius:999px;padding:calc(var(--u)*6px) calc(var(--u)*18px) calc(var(--u)*6px) calc(var(--u)*8px);font-weight:900;font-size:calc(var(--u)*32px)}
.coin-ico{width:calc(var(--u)*36px);height:calc(var(--u)*36px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc531 55%,#e09a00);border:calc(var(--u)*4px) solid #2a2140}
.grow{flex:1;display:flex;align-items:center;min-width:0}
.stage{z-index:1;width:calc(var(--u)*66px);height:calc(var(--u)*66px);border-radius:50%;background:#ff5fa2;color:#fff;border:calc(var(--u)*5px) solid #2a2140;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*36px);flex:none}
.bar{flex:1;height:calc(var(--u)*30px);margin-left:calc(var(--u)*-14px);background:#fff;border:calc(var(--u)*5px) solid #2a2140;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#ff8fc0,#ff5fa2);transition:width .25s}
.icon{width:calc(var(--u)*72px);height:calc(var(--u)*72px);border-radius:50%;background:#fff !important;border:calc(var(--u)*5px) solid #2a2140 !important;font-size:calc(var(--u)*34px) !important;display:grid;place-items:center;padding:0;flex:none}
.combo{position:absolute;top:calc(var(--u)*120px);left:0;right:0;text-align:center;font-weight:900;font-size:calc(var(--u)*56px);color:#ff5fa2;-webkit-text-stroke:calc(var(--u)*3px) #fff;paint-order:stroke;text-shadow:0 calc(var(--u)*5px) 0 #2a2140;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}
.banner{position:absolute;top:36%;left:0;right:0;text-align:center;font-weight:900;font-size:calc(var(--u)*92px);color:#ffc531;-webkit-text-stroke:calc(var(--u)*6px) #2a2140;paint-order:stroke;text-shadow:0 calc(var(--u)*9px) 0 #2a2140;opacity:0;transform:scale(.3)}
.banner.show{animation:ban 1.4s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-20%)}}
.pops{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font-weight:900;font-size:calc(var(--u)*44px*var(--s));-webkit-text-stroke:calc(var(--u)*5px) #fff;paint-order:stroke;white-space:nowrap;animation:pop 1.1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) rotate(var(--r)) scale(1.2)}30%{transform:translate(-50%,-90%) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(-50%,-200%) rotate(var(--r)) scale(1)}}
.flycoin{position:absolute;width:calc(var(--u)*34px);height:calc(var(--u)*34px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc531 55%,#e09a00);border:calc(var(--u)*4px) solid #2a2140;animation:fly .85s cubic-bezier(.5,-0.4,.7,1) forwards}
@keyframes fly{to{left:calc(var(--u)*50px);top:calc(var(--u)*55px);transform:scale(.6)}}
.hint{position:absolute;left:0;right:0;bottom:12%;text-align:center}
.hand{font-size:calc(var(--u)*110px);animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translate(-30%,0)}50%{transform:translate(30%,-25%)}}
.hint-t{display:inline-block;margin-top:calc(var(--u)*6px);background:#fff;border:calc(var(--u)*5px) solid #2a2140;border-radius:999px;padding:calc(var(--u)*8px) calc(var(--u)*30px);font-weight:900;font-size:calc(var(--u)*44px)}
.skill{position:absolute;right:calc(var(--u)*40px);bottom:calc(var(--u)*90px);width:calc(var(--u)*150px);height:calc(var(--u)*150px);border-radius:50%;background:#ff5fa2 !important;border:calc(var(--u)*7px) solid #2a2140 !important;display:grid;place-items:center;padding:0;box-shadow:0 calc(var(--u)*9px) 0 #2a2140}
.skill.ready{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sk-ico{font-size:calc(var(--u)*72px);z-index:1}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(42,33,64,.55) calc(var(--p,0)*360deg),transparent 0)}
.result{position:absolute;inset:0;pointer-events:auto;background:rgba(42,33,64,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*40px)}
.result .card{background:#fff;border:calc(var(--u)*7px) solid #2a2140;border-radius:calc(var(--u)*40px);padding:calc(var(--u)*30px) calc(var(--u)*50px);text-align:center;width:calc(var(--u)*520px);animation:card .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes card{from{transform:scale(.4)}}
.result h2{margin:0;font-size:calc(var(--u)*62px);color:#ff5fa2;font-weight:900}
.stars{font-size:calc(var(--u)*100px);letter-spacing:calc(var(--u)*10px);color:#e4dcef;-webkit-text-stroke:calc(var(--u)*4px) #2a2140}
.stars span{display:inline-block}
.stars .on{color:#ffc531;animation:star .45s backwards}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.result dl{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*6px) calc(var(--u)*20px);margin:calc(var(--u)*10px) 0;font-size:calc(var(--u)*34px);text-align:start}
.result dd{margin:0;font-weight:900}
.best{color:#22c6a3;font-weight:900;font-size:calc(var(--u)*40px)}
.again{background:#22c6a3 !important;color:#fff;font-weight:900;font-size:calc(var(--u)*54px) !important;padding:calc(var(--u)*26px) calc(var(--u)*70px);border-radius:999px;border:calc(var(--u)*7px) solid #2a2140 !important;box-shadow:0 calc(var(--u)*10px) 0 #2a2140;animation:pulse 1.1s ease-in-out infinite}
.langs{position:absolute;top:calc(var(--u)*110px);right:calc(var(--u)*20px);display:grid;gap:calc(var(--u)*8px);pointer-events:auto}
.langs button{background:#fff;border:calc(var(--u)*4px) solid #2a2140;border-radius:calc(var(--u)*18px);font-weight:900;font-size:calc(var(--u)*30px);padding:calc(var(--u)*12px) calc(var(--u)*24px);min-width:calc(var(--u)*110px)}
.langs button.on{background:#ffc531}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
