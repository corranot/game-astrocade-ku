// the loading screen follows the real steps (fonts, three.js, the game, its first frames) and creeps between them
(function () {
  var el = document.getElementById('load'), bar = el.querySelector('.lbar i'), knob = el.querySelector('.lbar b'), blocks = el.querySelectorAll('.blk');
  var shown = 0, target = 6, cap = 22, finished = false, flown = 0;
  function step(v) { if (v > target) target = v; cap = Math.max(cap, Math.min(97, v + 16)); }
  window.__load = { step: step, done: function () { step(100); cap = 100; finished = true; } };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { step(25); });
  addEventListener('three-ready', function () { step(55); });
  addEventListener('error', function () { setTimeout(function () { if (document.getElementById('load')) window.__load.done(); }, 4000); }); // a script error: never hide the page behind it for good
  function tick() {
    target += (cap - target) * 0.012; shown += (target - shown) * (finished ? 0.3 : 0.1);
    var p = Math.min(100, shown); bar.style.width = p + '%'; knob.style.left = p + '%'; knob.textContent = Math.floor(p);
    while (flown < 4 && p >= 100 - (4 - flown) * 22) { var b = blocks[blocks.length - 1 - (flown++ % blocks.length)]; b.style.setProperty('--fx', (Math.random() * 160 - 40) + '%'); b.style.setProperty('--fr', (Math.random() * 500 - 250) + 'deg'); b.classList.add('fly'); (function (x) { setTimeout(function () { x.classList.remove('fly'); }, 850); })(b); } // the block flies off, then the tower is built again
    if (finished && p > 99.5) { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
